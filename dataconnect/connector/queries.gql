# HO Network SQL Connect - Queries (الاستعلامات المالية والتشغيلية)

# جلب قائمة الموظفين والمستخدمين النشطين في النظام
query ListUsers {
  users {
    id
    uid
    email
    name
    role
    status
    createdAt
    updatedAt
  }
}

# الاستعلام عن مستخدم معين بواسطة المعرف الفريد لـ Firebase Auth
query GetUserByUid($uid: String!) {
  users(where: { uid: { eq: $uid } }) {
    id
    uid
    email
    name
    role
    status
    createdAt
    updatedAt
  }
}

# جلب قائمة العملاء وسجلات علاقات العملاء (CRM)
query ListCustomers {
  customers {
    id
    name
    email
    phone
    address
    notes
    status
    createdAt
    updatedAt
  }
}
