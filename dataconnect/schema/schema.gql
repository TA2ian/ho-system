# HO Network SQL Connect - GraphQL Schema Definition (RTL / Arabic Core)
# Version: 1.0 (Phase 1 Baseline)

# =========================================================================
# 1. IDENTITY & WORKFORCE DOMAINS (إدارة الهوية والموظفين والصلاحيات)
# =========================================================================

type User @table(name: "users", key: "id") {
  id: Int! @col(dataType: "serial")
  uid: String! @unique
  email: String!
  name: String
  role: String! # e.g. SUPER_ADMIN, ADMIN, ACCOUNTANT, MEDIA_MANAGER, etc.
  status: String! # ACTIVE, INACTIVE
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

# =========================================================================
# 2. CRM DOMAIN (إدارة علاقات العملاء)
# =========================================================================

type Customer @table(name: "customers", key: "id") {
  id: Int! @col(dataType: "serial")
  name: String!
  email: String
  phone: String
  address: String
  notes: String
  status: String! # LEAD, ACTIVE, INACTIVE, ARCHIVED
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

