openapi: 3.1.0
info:
  title: HO Network API
  version: 1.0.0-foundation
  description: |
    Contract snapshot for foundation/v1. The database and posted journal are authoritative.
    Request payload validation remains implemented by the application's Zod schemas.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Customers
  - name: Catalog
  - name: Sales Orders
  - name: Invoices
  - name: Receivables
  - name: Payments
  - name: Delivery
  - name: Exchange
  - name: Accounting
  - name: Expenses
  - name: Employees
  - name: Campaigns
  - name: Driver Collections
paths:
  /customers:
    get:
      tags: [Customers]
      operationId: listCustomers
      parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
    PaginationLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    PaginationOffset:
      name: offset
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
    UuidId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UuidCustomerId:
      name: customerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UuidAccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AsOfDate:
      name: asOfDate
      in: query
      required: true
      schema: { type: string, format: date }
    StartDate:
      name: startDate
      in: query
      required: true
      schema: { type: string, format: date }
    EndDate:
      name: endDate
      in: query
      required: true
      schema: { type: string, format: date }
  requestBodies:
    JsonObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    DataResponse:
      description: Successful response. Payload is returned under data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DataEnvelope'
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationError:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Conflict, including idempotency conflicts.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    DataEnvelope:
      type: object
      required: [data]
      properties:
        data: {}
        meta:
          type: object
          properties:
            limit: { type: integer }
            offset: { type: integer }
            hasMore: { type: boolean }
    ErrorEnvelope:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
        issues: {}
        retryAfterSeconds: { type: integer }
